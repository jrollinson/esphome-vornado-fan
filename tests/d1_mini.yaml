substitutions:
  vornado_ir_pin: GPIO4

external_components:
  - source:
      type: git
      url: https://github.com/jrollinson/esphome
      ref: vornado-ir-symphony-codes
    refresh: always
    components: [ vornado_ir ]
  - source:
      type: local
      path: ../components
    components: [ vornado_controller, vornado_stateful_controller ]

esphome:
  name: vornado-test-d1

esp8266:
  board: d1_mini

remote_transmitter:
  id: ir_tx
  pin: ${vornado_ir_pin}
  carrier_duty_percent: 50%

vornado_ir:
  id: vornado_ir_component
  transmitter_id: ir_tx

vornado_controller:
  id: vornado_ctrl
  vornado_ir_id: vornado_ir_component

vornado_stateful_controller:
  id: vornado_stateful
  name: "Vornado Fan"
  controller: vornado_ctrl

wifi:
  ssid: "test"
  password: "test1234"
  min_auth_mode: WPA2

api:
  encryption:
    key: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa="

ota:
  - platform: esphome
    password: "test1234"
