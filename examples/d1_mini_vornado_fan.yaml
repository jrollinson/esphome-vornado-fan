substitutions:
  vornado_ir_pin: GPIO4

packages:
  vornado_fan: github://jrollinson/esphome-vornado-fan/vornado-fan.yaml@main

esphome:
  name: kitchen-fan-controller
  friendly_name: "Kitchen Fan"

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # domain: ".your.domain"
  min_auth_mode: WPA2
  fast_connect: true
  power_save_mode: none

  ap:
    ssid: "Vornado-Fan-Fallback"
    password: !secret wifi_ap_password

captive_portal:

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min

ota:
  - platform: esphome
    password: !secret ota_password
