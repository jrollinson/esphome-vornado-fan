# ============================================================================
# Vornado Transom Fan IR Controller — Reusable Package
# ============================================================================
# Use as a package from your device config. Required substitutions:
#   vornado_ir_pin  — GPIO pin connected to the IR LED (e.g. GPIO4)
# ============================================================================

external_components:
  - source: github://jrollinson/esphome-vornado-fan@main
    refresh: always
    components: [ vornado_controller, vornado_stateful_controller ]

logger:
  logs:
    vornado_controller: INFO
    vornado_stateful: INFO

# IR Transmitter
remote_transmitter:
  id: ir_tx
  pin: ${vornado_ir_pin}
  carrier_duty_percent: 50%


# ============================================================================
# Vornado Controller Component (Base Layer)
# ============================================================================
# Handles intelligent command timing, screen wake detection, and IR transmission
# ============================================================================
vornado_controller:
  id: vornado_ctrl
  transmitter_id: ir_tx

# ============================================================================
# Vornado Stateful Controller
# ============================================================================
# Automatically creates:
#   - Text sensor:    <name> Power State (Unknown/Off/On)
#   - Numeric sensor: <name> Speed (NaN or 1-4)
#   - Buttons:        Turn On, Turn Off, Speed 1-4, Direction, Reset State
# ============================================================================
vornado_stateful_controller:
  id: vornado_stateful
  name: "Vornado Fan"
  controller: vornado_ctrl

