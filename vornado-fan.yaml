# ============================================================================
# Vornado Transom Fan IR Controller — Reusable Package
# ============================================================================
# Use as a package from your device config. Required substitutions:
#   vornado_ir_pin  — GPIO pin connected to the IR LED (e.g. GPIO4)
# ============================================================================

external_components:
  - source:
      type: git
      url: https://github.com/jrollinson/esphome
      ref: vornado-ir-symphony-codes
    refresh: always
    components: [ vornado_ir ]
  - source: github://jrollinson/esphome-vornado-fan@vornado-ir-integration
    refresh: always
    components: [ vornado_controller, vornado_stateful_controller ]

logger:
  logs:
    vornado_controller: INFO
    vornado_stateful: INFO
    vornado_ir: INFO

# IR Transmitter
remote_transmitter:
  id: ir_tx
  pin: ${vornado_ir_pin}
  carrier_duty_percent: 50%

# ============================================================================
# Vornado IR Component (Raw IR Layer)
# ============================================================================
vornado_ir:
  id: vornado_ir_component
  transmitter_id: ir_tx

# ============================================================================
# Vornado Controller Component (Base Layer)
# ============================================================================
# Handles intelligent command timing, screen wake detection, and IR transmission
# ============================================================================
vornado_controller:
  id: vornado_ctrl
  vornado_ir_id: vornado_ir_component
  min_spacing_ms: 400          # Minimum delay between IR commands
  screen_timeout_ms: 10000     # Time after which screen is considered asleep (10 sec)
  ensure_delay_ms: 15000       # Delay for "Ensure On" to guarantee screen sleep (15 sec)

# ============================================================================
# Vornado Stateful Controller
# ============================================================================
# Automatically creates:
#   - Text sensor:    <name> Power State (Unknown/Off/On)
#   - Numeric sensor: <name> Speed (NaN or 1-4)
#   - Buttons:        Turn On, Turn Off, Speed 1-4, Direction, Reset State
# ============================================================================
vornado_stateful_controller:
  id: vornado_stateful
  name: "Vornado Fan"
  controller: vornado_ctrl
