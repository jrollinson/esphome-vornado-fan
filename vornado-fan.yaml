# ============================================================================
# Vornado Transom Fan IR Controller — Reusable Package
# ============================================================================
# Use as a package from your device config. Required substitutions:
#   vornado_ir_pin  — GPIO pin connected to the IR LED (e.g. GPIO4)
# ============================================================================

external_components:
  - source: github://jrollinson/esphome-vornado-fan@button-based
    components: [ vornado_controller, vornado_stateful_controller ]

logger:
  logs:
    vornado_controller: INFO
    vornado_stateful: INFO

# IR Transmitter
remote_transmitter:
  id: ir_tx
  pin: ${vornado_ir_pin}
  carrier_duty_percent: 50%

# ============================================================================
# Vornado Controller Component (Base Layer)
# ============================================================================
vornado_controller:
  id: vornado_ctrl
  power_button: vornado_power_internal
  direction_button: vornado_direction_internal
  increase_button: vornado_increase_internal
  decrease_button: vornado_decrease_internal
  min_spacing_ms: 400
  screen_timeout_ms: 10000
  ensure_delay_ms: 15000

# ============================================================================
# Vornado Stateful Controller
# ============================================================================
# Automatically creates:
#   - Text sensor:    <name> Power State (Unknown/Off/On)
#   - Numeric sensor: <name> Speed (NaN or 1-4)
# ============================================================================
vornado_stateful_controller:
  id: vornado_stateful
  name: "Vornado Fan"
  controller: vornado_ctrl

button:
  # Internal buttons — direct IR command mappings, not exposed to Home Assistant
  - platform: template
    name: "Vornado Power Toggle"
    id: vornado_power_internal
    internal: true
    on_press:
      - remote_transmitter.transmit_symphony:
          transmitter_id: ir_tx
          data: 0xD84
          nbits: 12

  - platform: template
    name: "Vornado Change Direction"
    id: vornado_direction_internal
    internal: true
    on_press:
      - remote_transmitter.transmit_symphony:
          transmitter_id: ir_tx
          data: 0xD81
          nbits: 12

  - platform: template
    name: "Vornado Speed Increase"
    id: vornado_increase_internal
    internal: true
    on_press:
      - remote_transmitter.transmit_symphony:
          transmitter_id: ir_tx
          data: 0xDC6
          nbits: 12

  - platform: template
    name: "Vornado Speed Decrease"
    id: vornado_decrease_internal
    internal: true
    on_press:
      - remote_transmitter.transmit_symphony:
          transmitter_id: ir_tx
          data: 0xD82
          nbits: 12

  # User-facing controls
  - platform: template
    name: "Vornado Turn On"
    icon: mdi:power
    on_press:
      - vornado_stateful.turn_on:
          id: vornado_stateful

  - platform: template
    name: "Vornado Turn Off"
    icon: mdi:power-off
    on_press:
      - vornado_stateful.turn_off:
          id: vornado_stateful

  - platform: template
    name: "Vornado Speed 1"
    icon: mdi:fan-speed-1
    on_press:
      - vornado_stateful.set_speed:
          id: vornado_stateful
          speed: 1

  - platform: template
    name: "Vornado Speed 2"
    icon: mdi:fan-speed-2
    on_press:
      - vornado_stateful.set_speed:
          id: vornado_stateful
          speed: 2

  - platform: template
    name: "Vornado Speed 3"
    icon: mdi:fan-speed-3
    on_press:
      - vornado_stateful.set_speed:
          id: vornado_stateful
          speed: 3

  - platform: template
    name: "Vornado Speed 4"
    icon: mdi:fan
    on_press:
      - vornado_stateful.set_speed:
          id: vornado_stateful
          speed: 4

  - platform: template
    name: "Vornado Direction"
    icon: mdi:arrow-left-right
    on_press:
      - vornado_stateful.toggle_direction:
          id: vornado_stateful

  - platform: template
    name: "Vornado Reset State"
    icon: mdi:restart
    entity_category: diagnostic
    on_press:
      - vornado_stateful.reset_state:
          id: vornado_stateful
